<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Charlotte — Sleep Reference</title>
<style>
  :root {
    --bg: #12141A;
    --surface: #1A1D25;
    --surface-2: #22262F;
    --line: #2E333E;
    --ink: #E3D5BC;
    --ink-dim: #9A9384;
    --ink-faint: #6B6B70;
    --amber: #E09456;
    --amber-soft: #B87740;
    --sage: #7FB9AE;
    --warn: #C96A5A;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
    --body: system-ui, -apple-system, "Segoe UI", sans-serif;
    --pad: 16px;
  }
  .day {
    --bg: #E9EDEC;
    --surface: #FFFFFF;
    --surface-2: #F2F5F4;
    --line: #D3DBD9;
    --ink: #1B2027;
    --ink-dim: #5C6670;
    --ink-faint: #8A939B;
    --amber: #B4622A;
    --amber-soft: #C98246;
    --sage: #4C8A7E;
    --warn: #A8412F;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    /* clear the home indicator when installed to the home screen */
    padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
    transition: background .3s, color .3s;
  }
  #app { max-width: 480px; margin: 0 auto; }

  /* ---------- Top bar ---------- */
  .bar {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    /* "black" status bar means iOS reserves the notch area itself, so the
       inset is normally 0 here. It stays in the calc for the cases that do
       report one (landscape, translucent fallbacks). */
    padding: calc(14px + env(safe-area-inset-top, 0px))
             calc(var(--pad) + env(safe-area-inset-right, 0px))
             0
             calc(var(--pad) + env(safe-area-inset-left, 0px));
  }
  .bar-head {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 30px;
    margin-bottom: 12px;
  }
  .wordmark {
    font-family: var(--mono);
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  .lightbtn {
    background: none; border: 1px solid var(--line); color: var(--ink-dim);
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
    padding: 5px 9px; border-radius: 999px; cursor: pointer;
  }
  .modes { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .modes::-webkit-scrollbar { display: none; }
  .mode {
    flex: 0 0 auto;
    background: none; border: 1px solid var(--line); color: var(--ink-dim);
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase;
    padding: 8px 12px; border-radius: 8px; cursor: pointer;
  }
  .mode[aria-selected="true"] { background: var(--surface-2); color: var(--ink); border-color: var(--amber-soft); }

  /* ---------- Timer ---------- */
  .clockwrap { padding: 22px calc(var(--pad) + env(safe-area-inset-right, 0px)) 18px calc(var(--pad) + env(safe-area-inset-left, 0px)); text-align: center; }
  .presets { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
  .preset {
    background: none; border: 1px solid var(--line); color: var(--ink-dim);
    font-family: var(--mono); font-size: 11px;
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
  }
  .preset[aria-pressed="true"] { border-color: var(--sage); color: var(--sage); }
  .evtitle {
    font-family: var(--mono); font-size: 13px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--sage); margin-bottom: 6px;
  }
  .evtitle.due { color: var(--amber); }
  .evtitle.over { color: var(--warn); }
  .seqmeta {
    min-height: 16px; margin-bottom: 14px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
    color: var(--ink-faint);
  }
  .seqmeta b { color: var(--sage); font-weight: 400; }
  .clock {
    font-family: var(--mono);
    font-size: 68px; font-weight: 300; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
    color: var(--ink);
  }
  .clock.done { color: var(--amber); }
  .state {
    min-height: 44px;
    margin: 14px auto 0; max-width: 300px;
    font-size: 15px; color: var(--ink-dim);
  }
  .state b { color: var(--ink); font-weight: 600; }
  .controls { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .btn {
    flex: 1 1 40%; padding: 15px 8px; border-radius: 10px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .btn.primary { flex-basis: 100%; background: var(--amber); border-color: var(--amber); color: #17120C; font-weight: 600; }
  .day .btn.primary { color: #FFF; }
  .btn.ghost { color: var(--ink-dim); }
  .btn:disabled { opacity: .35; cursor: default; }
  /* ---------- First-run gate ---------- */
  .gate {
    position: fixed; inset: 0; z-index: 60;
    background: var(--bg); display: grid; place-items: center;
    padding: calc(var(--pad) + env(safe-area-inset-top, 0px)) var(--pad)
             calc(var(--pad) + env(safe-area-inset-bottom, 0px));
  }
  .gatebox { width: 100%; max-width: 320px; }
  .gatetitle { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .gatehint { font-size: 13px; color: var(--ink-faint); margin: 0 0 18px; }
  .gatelabel {
    display: block; font-family: var(--mono); font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint);
    margin-bottom: 5px;
  }
  .gateinput {
    width: 100%; padding: 13px 12px; margin-bottom: 16px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 9px;
    font-family: var(--body); font-size: 16px;
  }
  #gateSave { width: 100%; }

  /* ---------- Logging ---------- */
  .logbar { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  .logrow { display: flex; gap: 6px; flex-wrap: wrap; }
  .logbtn {
    flex: 1 1 auto; min-width: 72px;
    padding: 12px 6px; border-radius: 9px; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--ink);
    font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  }
  .logbtn:active { border-color: var(--sage); }
  .logstat {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
  }
  .logstat.ok { color: var(--sage); }
  .logstat.bad { color: var(--warn); }
  .retry {
    background: none; border: 1px solid var(--warn); color: var(--warn);
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
    padding: 5px 9px; border-radius: 6px; cursor: pointer;
  }
  .flash { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
  @media (prefers-reduced-motion: reduce) { .flash { animation: none } }

  /* ---------- Content ---------- */
  .body {
    padding: 0 calc(var(--pad) + env(safe-area-inset-right, 0px))
             0 calc(var(--pad) + env(safe-area-inset-left, 0px));
  }
  .note {
    background: var(--surface-2); border-left: 2px solid var(--sage);
    padding: 10px 12px; border-radius: 0 8px 8px 0;
    font-size: 14px; color: var(--ink-dim); margin-bottom: 12px;
  }
  details {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; margin-bottom: 8px; overflow: hidden;
  }
  summary {
    padding: 14px; cursor: pointer; list-style: none;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; font-weight: 600;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: "+"; font-family: var(--mono); font-size: 18px; color: var(--ink-faint);
  }
  details[open] summary::after { content: "\2212"; }
  details[open] summary { border-bottom: 1px solid var(--line); }
  .inner { padding: 12px 14px 15px; font-size: 15px; }
  .tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-faint);
    display: block; margin-bottom: 3px;
  }

  ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
  ol.steps li {
    counter-increment: s; position: relative;
    padding: 9px 0 9px 34px; border-bottom: 1px solid var(--line);
  }
  ol.steps li:last-child { border-bottom: 0; }
  ol.steps li::before {
    content: counter(s); position: absolute; left: 0; top: 10px;
    font-family: var(--mono); font-size: 11px; color: var(--sage);
    border: 1px solid var(--line); border-radius: 50%;
    width: 22px; height: 22px; display: grid; place-items: center;
  }
  ol.steps li small { display: block; color: var(--ink-faint); font-size: 13px; }
  ol.steps li.final::before { border-color: var(--amber); color: var(--amber); }
  ol.steps li.final { color: var(--amber); font-weight: 600; }

  ul.plain { margin: 0; padding-left: 18px; }
  ul.plain li { margin-bottom: 8px; }
  ul.plain li:last-child { margin-bottom: 0; }
  ul.nope { list-style: none; margin: 0; padding: 0; }
  ul.nope li {
    padding: 8px 0 8px 24px; position: relative;
    border-bottom: 1px solid var(--line); font-size: 15px;
  }
  ul.nope li:last-child { border-bottom: 0; }
  ul.nope li::before {
    content: "\00D7"; position: absolute; left: 4px; top: 8px;
    color: var(--warn); font-family: var(--mono);
  }

  .ladder { display: flex; flex-direction: column; gap: 6px; }
  .rung { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; background: var(--surface-2); border-radius: 8px; }
  .rung span { font-family: var(--mono); font-size: 11px; color: var(--sage); padding-top: 3px; }
  .rung.avoid span { color: var(--warn); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td:first-child { font-family: var(--mono); font-size: 12px; color: var(--sage); white-space: nowrap; padding-right: 12px; width: 1%; }
  td.warnrow { color: var(--amber); }

  .foot { padding: 26px var(--pad) 10px; font-size: 12px; color: var(--ink-faint); line-height: 1.6; }
  .hide { display: none; }
  :focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }
</style>

<div id="gate" class="gate hide">
  <div class="gatebox">
    <div class="gatetitle">Set up this phone</div>
    <p class="gatehint">Just once. Ask Patrick for the PIN.</p>
    <label class="gatelabel" for="whoIn">Your name</label>
    <input id="whoIn" class="gateinput" type="text" autocomplete="name" placeholder="Jennie">
    <label class="gatelabel" for="pinIn">PIN</label>
    <input id="pinIn" class="gateinput" type="password" autocomplete="off">
    <button class="btn primary" id="gateSave">Save</button>
    <p class="gatehint" id="gateMsg"></p>
  </div>
</div>

<div id="app">
  <div class="bar">
    <div class="bar-head">
      <div class="wordmark">Charlotte &middot; Sleep</div>
      <div style="display:flex;gap:6px">
        <button class="lightbtn" id="langToggle">TAGALOG</button>
        <button class="lightbtn" id="lightToggle">DAY MODE</button>
      </div>
    </div>
    <div class="modes" role="tablist" id="modes">
      <button class="mode" role="tab" data-mode="now" aria-selected="true" id="tabNow">Now</button>
      <button class="mode" role="tab" data-mode="ref" aria-selected="false" id="tabRef">Reference</button>
    </div>
  </div>

  <div class="clockwrap" id="clockwrap">
    <div class="evtitle" id="evTitle"></div>
    <div class="seqmeta" id="seqMeta"></div>
    <div class="clock" id="clock">--:--</div>
    <div class="state" id="state"></div>
    <div class="controls" id="controls"></div>
    <div class="logbar" id="logbar">
      <div class="logrow" id="logrow"></div>
      <div class="logstat" id="logstat">
        <span id="logmsg">Ready to log</span>
        <button class="retry hide" id="retryBtn">Retry</button>
      </div>
    </div>
  </div>

  <div class="body" id="content"></div>

  <div class="foot">
    Reorganized from Lindsay Lewis Sleep's plan for Charlotte. No advice added or changed.<br>
    Health questions &rarr; your family doctor. Voxer for plan questions, Mon&ndash;Sat 8&ndash;6.
  </div>
</div>

  function fmt(s) {
    s = Math.max(0, Math.round(s));
    if (s >= 3600) {
      return Math.floor(s / 3600) + ":" + String(Math.floor(s % 3600 / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    }
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");

  }

    var e = now - start;
    return e < 0 ? e + 1440 : e;

     but not asleep yet", and it means both phones agree without either

    { row: 11, grp: null,   field: "morningWake", event: "wakeup",  kind: "wakeup",  title: S().evWake, at: "wakeAt" },
    { row: 14, grp: "nap1", field: "crib",        event: "nap1",    kind: "nap",     title: S().evNap1, at: "nap1At" },
    { row: 15, grp: "nap1", field: "asleep",      event: "nap1",    kind: "nap",     title: S().evNap1, at: "nap1At" },
    { row: 16, grp: "nap1", field: "awake",       event: "nap1",    kind: "nap",     title: S().evNap1, at: "nap1At" },
    { row: 21, grp: "nap2", field: "crib",        event: "nap2",    kind: "nap",     title: S().evNap2, at: "nap2At" },
    { row: 22, grp: "nap2", field: "asleep",      event: "nap2",    kind: "nap",     title: S().evNap2, at: "nap2At" },
    { row: 23, grp: "nap2", field: "awake",       event: "nap2",    kind: "nap",     title: S().evNap2, at: "nap2At" },
    { row: 30, grp: "bed",  field: "crib",        event: "bedtime", kind: "bedtime", title: S().evBed, at: "bedAt" },

    if (!s) return null;

  function currentEvent() {
    if (!sheetState) return null;

    var step = null;
    for (var i = 0; i < STEPS.length; i++) {
      if (valueAt(STEPS[i]) === null) { step = STEPS[i]; break; }
    }
    if (!step) return { key: "done", kind: "bedtime", title: S().evDone, phase: "done", at: DAY.bedAt };

    var grp = step.grp ? sheetState[step.grp] : null;

    return {
      key:   step.event,
      kind:  step.kind,
      title: step.title,
      row:   step.row,
      /* upcoming = nothing logged yet · settling = in the crib, not asleep

      phase: step.field === "asleep" ? "settling"
           : step.field === "awake"  ? "sleeping"
           : "upcoming",
      at:       DAY[step.at],
      cribAt:   grp ? grp.crib : null,
      asleepAt: grp ? grp.asleep : null

  }

  function nextAfter(ev) {
    if (ev.key === "wakeup")  return { title: S().evNap1, at: DAY.nap1At };
    if (ev.key === "nap1")    return { title: S().evNap2, at: DAY.nap2At };
    if (ev.key === "nap2")    return { title: S().evBed, at: DAY.bedAt };
    return { title: S().evWake, at: DAY.wakeAt };

  /* Cap on a sleep in progress, in minutes. */
  function capFor(ev) {
    if (ev.kind !== "nap") return DAY.nightMax;
    if (ev.key === "nap1") return DAY.singleNapMax;

    var used = 0;
    if (sheetState.nap1.asleep !== null && sheetState.nap1.awake !== null) {
      used = elapsedSince(sheetState.nap1.asleep, sheetState.nap1.awake);
    }
    var from = ev.asleepAt !== null ? ev.asleepAt : ev.at;
    return Math.max(0, Math.min(DAY.daytimeMax - used, DAY.lastNapEndBy - from));

  /* Which block of notes belongs under the current event. */
  function contentFor(ev) {
    if (!ev) return "nap";
    if (ev.key === "wakeup") return "early";
    if (ev.key === "night" || ev.key === "done") return "night";

  /* ---------- timer plumbing ---------- */

  }

  /* Countdowns are anchored to a wall-clock end time, not to a counter that
     ticks down. Background tabs and locked screens throttle or suspend
     intervals, so a decrementing counter silently pauses — the 10-minute
     wait would never finish while the phone was in your pocket. */
  var endAt = null;

  function run(secs) {
    stop();
    endAt = Date.now() + secs * 1000;
    remain = secs;
    running = true;
    timer = setInterval(tickTimer, 250);
    requestWake();
    render();
  }

  function tickTimer() {
    if (endAt === null) return;
    var left = Math.ceil((endAt - Date.now()) / 1000);
    if (left <= 0) {
      remain = 0;
      endAt = null;
      stop();
      buzz();
      onExpire();
    } else {
      remain = left;
    }
    render();
  }

  /* ---------- the settling loop ---------- */

  var seq = null;   // { cfg, kind, phase, startedAt, attempt, attemptStartedAt }

  function seqElapsed()     { return seq ? Math.floor((Date.now() - seq.startedAt) / 1000) : 0; }
  function attemptElapsed() { return seq && seq.attemptStartedAt ? Math.floor((Date.now() - seq.attemptStartedAt) / 1000) : 0; }
  function attemptLimit()   { return seq && seq.cfg.attempts ? seq.cfg.attempts[seq.attempt] : null; }

  function phase(p, secs) {
    seq.phase = p;
    if (secs === null) { stop(); endAt = null; remain = null; render(); }
    else run(secs);
  }

  function seqStart(kind) {
    logAction(SEQ[kind].startAction, SEQ[kind].startLabel);

  }

  function seqResume(kind) {

    run(cfg.wait);

    var cfg = seq.cfg;
    logAction(cfg.asleepAction, cfg.asleepLabel);

    if (!seq) return;

    else if (seq.phase === "checkin") seq.phase = "checkinDone";
    else if (seq.phase === "break")   seq.phase = "breakDone";

  /* The attempt window can run out mid-wait, not only at an expiry. */
  function watchAttempt() {

      controlsSig = sig;
      c.innerHTML = list.map(function (b) {
        return '<button class="btn ' + (b.cls || "") + '">' + b.label + "</button>";
      }).join("");
    }
    Array.prototype.forEach.call(c.children, function (el, i) {
      if (list[i]) el.onclick = list[i].fn;
    });
  }

  function setContent(key) {
    if (contentKey === key) return;
    contentKey = key;
    $("content").innerHTML = M()[key].html;
  }

  /* Avoid rewriting identical HTML every tick — it forces layout and
     can interrupt a tap in progress. */
  function put(el, html) { if (el.innerHTML !== html) el.innerHTML = html; }
  function putText(el, txt) { if (el.textContent !== txt) el.textContent = txt; }
  function putClass(el, cls) { if (el.className !== cls) el.className = cls; }

  function render() {
    var title = $("evTitle"), meta = $("seqMeta"), clock = $("clock"), st = $("state");

    if (mode === "ref") {
      $("clockwrap").classList.add("hide");
      setContent("ref");
      renderLogButtons("ref");
      return;
    }
    $("clockwrap").classList.remove("hide");

    /* --- the Now tab --- */
    var ev = currentEvent();
    if (!ev) {
      putText(title, "");
      putClass(title, "evtitle");
      putText(meta, "");
      putText(clock, "--:--");
      putClass(clock, "clock");
      put(st, S().waiting);
      setControls([]);
      setContent("nap");
      renderLogButtons("nap");
      return;
    }

    setContent(contentFor(ev));
    renderLogButtons(
      (ev.key === "night" || isNightHours()) ? "night"
        : ev.kind === "wakeup" ? "wakeup"
        : ev.kind);

    /* A settling loop in progress takes over the display. */
    if (seq) {
      renderLoop(seq.kind,
        seq.kind === "night" ? S().evNightWake
          : seq.kind === "napstir" ? ev.title + " \u00b7 " + S().stirTitle
          : ev.title,
        "");
      return;
    }

    if (ev.phase === "done") {
      putText(title, S().evDone);
      putClass(title, "evtitle");
      putText(meta, "");
      putText(clock, "--:--");
      putClass(clock, "clock");
      put(st, S().doneMsg);
      setControls([]);
      return;
    }

    /* In the crib, not asleep yet — either phone can pick up the loop. */
    if (ev.phase === "settling") {
      var down = ev.cribAt !== null ? ev.cribAt : nowMin();
      putText(title, ev.title + S().sufCrib);
      putClass(title, "evtitle");
      put(meta, S().cribSince(hhmm(down)));
      putText(clock, fmt(elapsedSince(down, nowMin()) * 60));
      putClass(clock, "clock");
      put(st, S().settleHint);
      setControls([
        { label: S().bStartWait, cls: "primary", fn: function () { seqResume(ev.kind); } },
        { label: S().bAsleep, fn: function () { logAction(SEQ[ev.kind].asleepAction, S().lAsleep); } }
      ]);
      return;
    }

    if (ev.phase === "sleeping") {
      var from  = ev.asleepAt !== null ? ev.asleepAt : ev.at;
      var slept = elapsedSince(from, nowMin());
      var cap   = capFor(ev);
      var over  = slept >= cap;

      putText(title, ev.title + S().sufAsleep);
      putClass(title, "evtitle" + (over ? " over" : ""));
      put(meta, S().downAt(hhmm(from)));
      putText(clock, fmt(slept * 60));
      putClass(clock, "clock" + (over ? " done flash" : ""));

      if (over) {
        put(st, ev.kind === "nap"
          ? S().napOver
          : S().nightOver);
      } else if (ev.kind === "nap") {
        put(st, S().napMax(dur(cap), hhmm(from + cap)));
      } else {
        put(st, S().nightMax(hhmm(from + cap)));
      }

      if (ev.kind === "nap") {
        setControls([
          { label: S().bWoke, cls: "primary", fn: function () { logAction("nap_awake", S().lAwake); } },
          { label: S().bStir, fn: function () { seqResume("napstir"); } }
        ]);
        return;
      }

      /* Overnight, one button — the clock decides which of the plan's three
         responses applies:
           before 05:30   a night waking, with check-ins
           05:30–05:59    no visits at all, hold out for 06:00
           06:00 onward   morning */
      if (holding) { renderHold(); return; }

      /* Nothing prominent to tap overnight — a big button at 2am is how a
         night gets ended by accident. Night wakings go through the manual
         row below; this appears only once it is actually morning. */
      if (nowMin() >= DAY.morningFloor && nowMin() < 12 * 60) {
        setControls([{ label: S().bUp, cls: "primary", fn: function () {
          logAction("morning_awake", S().bUp);
        } }]);
      } else {
        setControls([]);
        if (!over) put(st, st.innerHTML + " " + S().nightUseRow);
      }
      return;
    }

    /* Upcoming. */
    var secs = ev.at * 60 - nowSec();
    var late = secs < 0;
    var then = nextAfter(ev);

    putText(title, ev.title + (late ? S().sufLate : S().sufNext));
    putClass(title, "evtitle" + (late ? " due" : ""));
    putText(clock, fmt(Math.abs(secs)));
    putClass(clock, "clock" + (late ? " done" : ""));

    var bits = [S().scheduled(hhmm(ev.at))];
    if (ev.key !== "wakeup") bits.push(S().thenNext(then.title, hhmm(then.at)));
    var since = awakeSince();
    if (since !== null) bits.push(S().awakeFor(dur(elapsedSince(since, nowMin()))));
    put(meta, bits.join(" &middot; "));

    if (ev.kind === "wakeup") {
      put(st, S().wakeHint);
      setControls([{ label: "Up for the day", cls: "primary", fn: function () { logAction("morning_awake", S().bUp); } }]);
    } else {
      put(st, S().startHint);
      setControls([{ label: S().bStart, cls: "primary", fn: function () { seqStart(ev.kind); } }]);
    }
  }

  function awakeSince() {
    var s = sheetState;
    if (!s) return null;
    if (s.nap2.awake !== null)       return s.nap2.awake;
    if (s.nap1.awake !== null)       return s.nap1.awake;
    if (s.morningWake !== null)      return s.morningWake;
    return null;
  }

  /* What a night waking does depends on the clock. Shared so the manual row
     and any future caller can't drift apart. */
  function onNightWake() {
    var m = nowMin();
    if (m >= DAY.holdFrom && m < DAY.morningFloor) {
      holding = true;
      logAction("wake_start", S().lAwake);
      render();
    } else {
      seqStart("night");
    }
  }

  /* Short-nap rule: if she wakes early, leave her 10 minutes to reconnect
     rather than ending the nap. If she is still awake when that expires it
     runs the same check-in loop as bedtime. Nothing is logged unless she
     stays awake — a stir that resolves leaves the nap untouched. */

  function isNightHours() {
    var m = nowMin();
    return m >= 18 * 60 || m < DAY.morningFloor;
  }

  /* 05:30–06:00: the plan says no visits, so there is no check-in loop to
     run — just the wait, and the two ways it can end. */
  var holding = false;

  function renderHold() {
    var title = $("evTitle"), meta = $("seqMeta"), clock = $("clock"), st = $("state");
    var left = DAY.morningFloor * 60 - nowSec();

    putText(title, left > 0 ? S().holdTitle : S().holdMorning);
    putClass(title, "evtitle" + (left > 0 ? " due" : ""));
    put(meta, S().holdMeta);
    putText(clock, fmt(Math.abs(left)));
    putClass(clock, "clock" + (left > 0 ? "" : " done"));

    put(st, left > 0
      ? S().holdWait
      : S().holdDone);

    setControls([
      { label: S().bUp, cls: "primary", fn: function () { holding = false; logAction("morning_awake", S().bUp); } },
      { label: S().bBackAsleep, fn: function () { holding = false; logAction("night_waking", S().bBackAsleep); } }
    ]);
  }

  function renderLoop(kind, headline, idleText) {
    var cfg = SEQ[kind];
    var title = $("evTitle"), meta = $("seqMeta"), clock = $("clock"), st = $("state");

    if (!seq || seq.kind !== kind) {
      putText(title, headline);
      putClass(title, "evtitle");
      putText(meta, "");
      putText(clock, "--:--");
      putClass(clock, "clock");
      put(st, idleText);
      setControls([{ label: S().bStart, cls: "primary", fn: function () { seqStart(kind); } }]);
      return;
    }

    putText(title, headline + S().sufSettling);
    putClass(title, "evtitle");

    var bits = [S().totalIs(fmt(seqElapsed()))];
    if (cfg.attempts) {
      bits.push(S().tryIs(seq.attempt + 1));
      if (seq.phase !== "break" && seq.phase !== "breakDone" && attemptLimit() !== null) {
        bits.push(S().leftIs(fmt(Math.max(0, attemptLimit() - attemptElapsed()))));
      }
    }
    put(meta, bits.join(" &middot; "));

    putText(clock, remain === null ? "--:--" : fmt(Math.max(0, remain)));
    putClass(clock, "clock" + (remain !== null && remain <= 0 ? " done flash" : ""));

    var atReset = cfg.resetAfter && seqElapsed() >= cfg.resetAfter;
    put(st, S().loop[seq.phase === "waitDone" && atReset ? "resetOffer" : seq.phase] || "");

    var asleep  = kind === "napstir"
      ? { label: S().bResettled, fn: seqStop }
      : { label: S().bAsleep, fn: seqAsleep };

    var stopBtn = kind === "napstir"
      ? { label: S().bWoke, cls: "ghost", fn: function () { seqStop(); logAction("nap_awake", S().lAwake); } }
      : { label: S().bStop, cls: "ghost", fn: seqStop };
    var quiet   = { label: S().bQuiet, fn: function () { phase("quiet", null); } };

    if (seq.phase === "wait")             setControls([asleep, quiet, stopBtn]);
    else if (seq.phase === "quiet") {
      put(st, S().loop.quiet);
      setControls([{ label: S().bCrying, cls: "primary", fn: function () { phase("wait", cfg.wait); } }, asleep, stopBtn]);
    }
    else if (seq.phase === "waitDone")    setControls(atReset
        ? [{ label: S().bReset, cls: "primary", fn: function () { seq.startedAt = Date.now(); phase("wait", cfg.wait); } },
           { label: S().bKeep, fn: function () { phase("wait", cfg.wait); } }, asleep]
        : [{ label: S().bCheckin, cls: "primary", fn: function () { phase("checkin", cfg.checkin); } }, asleep, stopBtn]);
    else if (seq.phase === "checkin" || seq.phase === "checkinDone")
      setControls([{ label: S().bLeft, cls: "primary", fn: function () { phase("wait", cfg.wait); } }, asleep]);
    else if (seq.phase === "attemptDone") setControls([{ label: S().bBreak, cls: "primary", fn: function () { phase("break", cfg.breakSecs); } }, asleep, stopBtn]);
    else if (seq.phase === "break")       setControls([asleep, stopBtn]);
    else if (seq.phase === "breakDone")   setControls(
        seq.attempt + 1 < cfg.attempts.length
          ? [{ label: S().bSecond, cls: "primary", fn: function () {
                seq.attempt++; seq.attemptStartedAt = Date.now();
                logAction(cfg.startAction, cfg.startLabel);
                phase("wait", cfg.wait);
              } }, asleep, stopBtn]
          : [{ label: S().bEmergency, cls: "primary", fn: function () { phase("exhausted", null); } }, stopBtn]);
    else setControls([asleep, stopBtn]);
  }

  /* ---------- logging ---------- */

  var lastEventAt = null, WHO = "", TOKEN = "";

  function status(msg, cls) {
    $("logmsg").textContent = msg;
    $("logstat").className = "logstat" + (cls ? " " + cls : "");
    $("retryBtn").classList.toggle("hide", !queue.length);
  }

  function push(action, value, note, label) {
    var now = new Date();
    queue.push({ ts: now.toISOString(), mode: mode, action: action, value: value || "", note: note || "", who: WHO });
    lastEventAt = now;
    status(S().sending(label, clockOf(now)));
    if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
    flush();
  }

  function logAction(action, label) { if (action) push(action, "", "", label); }

  function log(def) {
    if (def.run) { def.run(); return; }
    var value = "", note = "";
    if (def.note) {
      note = window.prompt(S().pNote) || "";
      if (!note.trim()) return;
    } else if (def.ask) {
      value = window.prompt(def.ask) || "";
      if (!value.trim() && !def.optional) return;
    }
    push(def.action, value, note, def.label);
  }

  function flush() {
    if (sending || !queue.length) return;
    if (!SCRIPT_URL) { status(S().noUrl(queue.length), "bad"); return; }

    sending = true;
    var batch = queue.slice();

    fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ token: TOKEN, events: batch }),
      redirect: "follow"
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        sending = false;
        if (res && res.ok) {
          queue = queue.slice(batch.length);
          if (res.status) sheetState = res.status;
          var cells = (res.cells || []).join(", ");
          status(cells ? S().wrote(cells) : S().logged, "ok");
          $("retryBtn").classList.add("hide");
          render();
        } else {
          var msg = res && res.error ? res.error : "Rejected";
          if (msg === "SECRET not set") {
            /* The script's secret is still the placeholder — the PIN on this
               phone is probably fine, so don't throw it away. */
            status(S().secretMissing, "bad");
            return;
          }
          if (msg === "Bad token") {
            queue = []; store.set("sleeplog.pin", ""); TOKEN = "";
            showGate();
            $("gateMsg").textContent = S().gateBad;
            return;
          }
          status(msg + " \u2014 " + queue.length + " held", "bad");
        }
      })
      .catch(function () {
        sending = false;
        status(S().held(queue.length), "bad");
      });
  }

  var logKey = null;

  function renderLogButtons(key) {
    if (key === logKey) return;
    logKey = key;

    var defs = logButtons()[key] || [], row = $("logrow"), bar = $("logbar");
    if (!defs.length) { bar.classList.add("hide"); return; }
    bar.classList.remove("hide");
    row.innerHTML = defs.map(function (d) { return '<button class="logbtn">' + d.label + "</button>"; }).join("");
    Array.prototype.forEach.call(row.children, function (b, i) {
      b.onclick = function () { log(defs[i]); };
    });
    if (!queue.length) status(S().ready);
  }

  function fetchStatus() {
    if (!SCRIPT_URL || !TOKEN) return;
    fetch(SCRIPT_URL, { method: "GET", redirect: "follow" })
      .then(function (r) { return r.json(); })
      .then(function (res) { if (res && res.status) { sheetState = res.status; render(); } })
      .catch(function () {});
  }

  /* ---------- wiring ---------- */

  function setMode(m) {
    mode = m;
    contentKey = null; controlsSig = null; logKey = null;
    Array.prototype.forEach.call(document.querySelectorAll(".mode"), function (b) {
      b.setAttribute("aria-selected", b.dataset.mode === m ? "true" : "false");
    });
    render();
    window.scrollTo(0, 0);
  }

  Array.prototype.forEach.call(document.querySelectorAll(".mode"), function (b) {
    b.onclick = function () { setMode(b.dataset.mode); };
  });

  function applyLang() {
    var t = S();
    $("langToggle").textContent = t.langBtn;
    $("lightToggle").textContent = document.body.classList.contains("day") ? t.light[1] : t.light[0];
    $("tabNow").textContent = t.tabNow;
    $("tabRef").textContent = t.tabRef;

    document.querySelector(".gatetitle").textContent = t.gateTitle;
    document.querySelector(".gatehint").textContent  = t.gateHint;
    document.querySelector('label[for="whoIn"]').textContent = t.gateName;
    document.querySelector('label[for="pinIn"]').textContent = t.gatePin;
    $("gateSave").textContent = t.gateSave;
    $("retryBtn").textContent = t.retry;

    contentKey = null; controlsSig = null; logKey = null;
    render();
  }

  $("langToggle").onclick = function () {
    lang = lang === "tl" ? "en" : "tl";
    store.set("sleeplog.lang", lang);
    applyLang();
  };

  $("lightToggle").onclick = function () {
    var day = document.body.classList.toggle("day");
    this.textContent = day ? S().light[1] : S().light[0];
    document.querySelector('meta[name="theme-color"]').setAttribute("content", day ? "#E9EDEC" : "#12141A");
  };

  $("retryBtn").onclick = flush;
  window.addEventListener("online", flush);

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
      if (running) requestWake();
      tickTimer();
      fetchStatus();
    }
  });

  /* Tick for the live count-up, and re-check the day every minute so the
     event advances on its own. */
  setInterval(function () { if (endAt !== null) tickTimer(); watchAttempt(); render(); }, 1000);
  setInterval(fetchStatus, 20000);

  function showGate() {
    $("gate").classList.remove("hide");
    $("whoIn").value = WHO;
  }

  $("gateSave").onclick = function () {
    var who = $("whoIn").value.trim(), pin = $("pinIn").value.trim();
    if (!who || !pin) { $("gateMsg").textContent = S().gateBoth; return; }
    WHO = who; TOKEN = pin;
    store.set("sleeplog.who", who);
    store.set("sleeplog.pin", pin);
    $("gate").classList.add("hide");
    status(S().setUpFor(who));
    fetchStatus();
  };

  $("pinIn").addEventListener("keydown", function (e) {
    if (e.key === "Enter") $("gateSave").click();
  });

  TOKEN = store.get("sleeplog.pin") || "";
  WHO   = store.get("sleeplog.who") || "";

  applyLang();
  setMode("now");
  if (!TOKEN) showGate(); else fetchStatus();
})();
</script>
